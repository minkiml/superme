<!doctype html>
<!--
  Review gate report — TEMPLATE (renovation §0b chapter grammar; hermes discipline).
  The template owns ALL style, layout, and rendering. The agent fills exactly ONE slot:
  {{DATA_JSON}} — a single-line JSON object (no markdown, no HTML) with this shape:

  {
    "title":  "<item title>",
    "item":   "<item id>",
    "ask":    "<one sentence — what merging sets in motion>",
    "recommendation": "Merge" | "Hold & fix <what>" | "Merge anyway (accepting <risk>)",
    "reason": "<the recommendation's why, one line>",
    "warnings": ["worst first, one line each", ...],   // [] when truly none
    "stats":  {"files": N, "insertions": N, "deletions": N, "tests": "18 passing"},
    "by_file": [{"path": "...", "plus": N, "minus": N}, ...],
    "surface": "<short label of the behavior surface, e.g. 'CLI — tally sum'>",
    "promised":  "<the plan's predicted After pane, verbatim>",
    "delivered": "<the REAL captured output from the vet ledger, verbatim>",
    "checks": [{"id": "...", "pass": true}, ...],
    "cycles": N                                        // vet cycles it took
  }

  Every number shown is COUNTED/echoed from this data — never invented. Output goes to
  work-items/<id>/artifacts/gate-report-review.html (reader: user). A leftover {{...}} slot
  fails the review gate check.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review gate report</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d; --txt: #c9d1d9; --dim: #8b949e;
    --accent: #58a6ff; --ok: #3fb950; --bad: #f85149; --warn: #d29922; --read: #6e7681;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--txt); font: 14px/1.55 -apple-system, "Segoe UI", sans-serif;
         max-width: 880px; margin: 0 auto; padding: 36px 28px 64px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 8px; }
  .kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  h1 { font-size: 21px; font-weight: 650; margin: 6px 0 2px; }
  .itemid { font-size: 11px; color: var(--dim); }
  .hero { font-size: 17px; line-height: 1.5; margin: 22px 0 6px; font-weight: 430; }
  .hero b { color: var(--accent); font-weight: 700; }
  .ask { color: var(--dim); font-size: 13px; }
  section { margin-top: 40px; }
  .chnum { font-size: 30px; font-weight: 800; color: var(--accent); opacity: .85; }
  .chhead { display: flex; align-items: baseline; gap: 14px; }
  .chtitle { font-size: 16px; font-weight: 650; }
  .chkick { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .thesis { border-left: 3px solid var(--accent); background: rgba(88,166,255,.07);
            padding: 10px 14px; margin: 14px 0 18px; font-size: 13.5px; border-radius: 0 6px 6px 0; }
  .thesis b { color: var(--accent); }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
  .pane .bar { display: flex; justify-content: space-between; align-items: center;
               padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  .badge { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px;
           border-radius: 10px; font-weight: 700; }
  .badge.plan { background: rgba(210,153,34,.18); color: var(--warn); }
  .badge.real { background: rgba(63,185,80,.18); color: var(--ok); }
  .pane pre { padding: 10px 12px; font-size: 12px; line-height: 1.5; overflow-x: auto;
              white-space: pre-wrap; word-break: break-word; }
  .surface { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  /* change bars */
  .filerow { display: grid; grid-template-columns: minmax(0,1fr) 90px 160px; gap: 10px;
             align-items: center; padding: 4px 0; font-size: 12px; }
  .filerow .p { color: var(--muted, #8b949e); word-break: break-all; }
  .filerow .n { text-align: right; color: var(--dim); }
  .bar2 { display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: var(--line); }
  .bar2 .plus { background: var(--ok); } .bar2 .minus { background: var(--bad); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
          padding: 4px 11px; font-size: 12px; display: flex; gap: 7px; align-items: baseline; }
  .verdict { border-radius: 6px; padding: 12px 16px; font-size: 15px; font-weight: 650;
             display: flex; gap: 10px; align-items: baseline; }
  .verdict.merge { background: rgba(63,185,80,.12); color: var(--ok); border: 1px solid rgba(63,185,80,.35); }
  .verdict.hold { background: rgba(210,153,34,.12); color: var(--warn); border: 1px solid rgba(210,153,34,.35); }
  .verdict .why { font-size: 12.5px; font-weight: 400; color: var(--txt); }
  .warn-card { display: flex; gap: 10px; border: 1px solid rgba(210,153,34,.4); border-radius: 6px;
               background: rgba(210,153,34,.07); padding: 9px 13px; margin-top: 8px; font-size: 12.5px; }
  .warn-card .g { color: var(--warn); font-weight: 800; }
  .empty { color: var(--read); font-size: 12px; }
  footer { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 12px;
           font-size: 10.5px; color: var(--read); }
</style>
</head>
<body>
<script type="application/json" id="data">{{DATA_JSON}}</script>
<div id="root"></div>
<script>
(function () {
  var d = JSON.parse(document.getElementById("data").textContent);
  var checks = d.checks || [], warns = d.warnings || [], files = d.by_file || [];
  var passN = checks.filter(function (c) { return c.pass; }).length;
  var st = d.stats || {};
  var esc = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  function chapter(n, title, kick, thesis, body) {
    return '<section><div class="chhead"><span class="chnum mono">' + n + '</span>' +
      '<div><div class="chtitle">' + title + '</div><div class="chkick">' + kick + '</div></div></div>' +
      '<div class="thesis">' + thesis + '</div>' + body + '</section>';
  }

  var hero = '<p class="hero"><b>' + (st.files != null ? st.files : "?") + ' file' +
    (st.files === 1 ? "" : "s") + '</b> changed (<b>+' + (st.insertions != null ? st.insertions : "?") +
    '/−' + (st.deletions != null ? st.deletions : "?") + '</b>), proven by <b>' + passN + '/' +
    checks.length + ' checks</b> in <b>' + (d.cycles != null ? d.cycles : "?") + ' cycle' +
    (d.cycles === 1 ? "" : "s") + '</b>' + (st.tests ? ' — tests: <b>' + esc(st.tests) + '</b>' : '') + '.</p>';

  var html =
    '<header><div class="kicker">Review gate · report</div>' +
    '<h1>' + esc(d.title) + '</h1>' +
    '<div class="itemid mono">' + esc(d.item) + '</div>' +
    hero + '<p class="ask">' + esc(d.ask) + '</p></header>';

  html += chapter("01", "What it does now", "promised at the plan gate vs captured by the vet",
    'The right pane is <b>captured reality</b> from the evidence ledger — compare it with what ' +
    'the plan promised you.',
    '<div class="surface mono">' + esc(d.surface) + '</div>' +
    '<div class="panes">' +
    '<div class="pane"><div class="bar"><span>promised</span><span class="badge plan">plan gate</span></div>' +
    '<pre class="mono">' + esc(d.promised) + '</pre></div>' +
    '<div class="pane"><div class="bar"><span>delivered</span><span class="badge real">captured</span></div>' +
    '<pre class="mono">' + esc(d.delivered) + '</pre></div></div>');

  var maxTot = 1;
  files.forEach(function (f) { maxTot = Math.max(maxTot, (f.plus || 0) + (f.minus || 0)); });
  var rows = files.length ? files.map(function (f) {
    var p = f.plus || 0, m = f.minus || 0, w = ((p + m) / maxTot) * 100;
    return '<div class="filerow"><span class="p mono">' + esc(f.path) + '</span>' +
      '<span class="n mono">+' + p + '/−' + m + '</span>' +
      '<span class="bar2" style="width:' + Math.max(w, 6) + '%">' +
      '<span class="plus" style="flex:' + p + '"></span>' +
      '<span class="minus" style="flex:' + m + '"></span></span></div>';
  }).join("") : '<div class="empty">&minus; no per-file stats recorded</div>';
  html += chapter("02", "How big", "per-file change weight",
    '<b>' + files.length + '</b> file' + (files.length === 1 ? "" : "s") +
    ' carry the change — bar length is churn, green added, red removed.', rows);

  var chips = checks.map(function (c) {
    return '<div class="chip"><span class="mono" style="color:' + (c.pass ? "var(--ok)" : "var(--bad)") +
      '">' + (c.pass ? "●" : "✕") + '</span><span class="mono">' + esc(c.id) + '</span></div>';
  }).join("");
  html += chapter("03", "Proof", "the vet plan's verdicts, ledger-backed",
    '<b>' + passN + ' of ' + checks.length + '</b> checks green after <b>' +
    (d.cycles != null ? d.cycles : "?") + '</b> vet cycle' + (d.cycles === 1 ? "" : "s") +
    ' — every chip is backed by a recorded ledger entry, never a claim.',
    checks.length ? '<div class="chips">' + chips + '</div>'
                  : '<div class="empty">&minus; no vet checks were planned</div>');

  var vclass = /^merge$/i.test(d.recommendation || "") ? "merge" : "hold";
  var wcards = warns.map(function (w, i) {
    return '<div class="warn-card"><span class="g">!</span><span>' + esc(w) + '</span></div>';
  }).join("");
  html += chapter("04", "Your call", "recommendation + what a merge could regret",
    warns.length ? '<b>' + warns.length + '</b> warning' + (warns.length === 1 ? "" : "s") +
      ', worst first — an empty list here must be true, not optimistic.'
      : 'No warnings recorded — <b>the agent claims a clean merge</b>; the checks above are the receipt.',
    '<div class="verdict ' + vclass + '"><span>' + esc(d.recommendation) + '</span>' +
    '<span class="why">' + esc(d.reason) + '</span></div>' + wcards);

  html += '<footer class="mono">generated by superme-dev:review · item ' + esc(d.item) +
    ' · data: readiness.md (stats) + evidence ledger (delivered pane, verdicts) + plan.md (promised pane)</footer>';
  document.getElementById("root").innerHTML = html;
})();
</script>
</body>
</html>
