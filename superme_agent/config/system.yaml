# System spine — the System entity's static half.
# Its live half (daemon health, active context, in-flight runs) is derived at read time.
# Hand-editable and git-tracked; a runtime override is a DB row, never an edit here.

version: 1
identity: SuperMe
default_model: null        # null = the CLI/host default model
policy_version: 1
default_repo: global       # the repo a surface binds to when none is specified
