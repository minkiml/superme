# System spine — singleton static-meta (PRD §4.11.3).
# The System entity's STATIC half. Its LIVE half (daemon health, active context,
# in-flight runs) is derived from .system.db at read time, never stored here.
# Hand-editable + git-tracked. Runtime overrides (e.g. per-repo model) are DB rows,
# not edits to this file.

version: 1
identity: SuperMe
default_model: null        # null = the CLI/host default model
policy_version: 1
default_repo: global       # the repo a surface binds to when none is specified
