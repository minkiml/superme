# Channel → workspace links.
# A workspace = a cwd (codebase/project) + optional per-workspace extras.
# Unlinked channels fall back to `default_workspace`.

default_workspace: default

workspaces:
  default:
    cwd: "."            # repo root (also the future global-harness codebase)

  dummy:
    cwd: "/Users/cooma/Developer/my_docs/dummy_project"
    persona_append: "You are operating in the DUMMY_PROJECT workspace; say so briefly when you start a task here."

  # More examples:
  # stock:
  #   cwd: "/Users/cooma/Developer/stock-research"
  #   persona_append: "You are a markets analyst. Not financial advice."
  #   extra_mcp: ["yfinance"]     # wired once that MCP server exists

# Link a Slack channel ID to a workspace name (ID = canonical key; name is a comment).
channels: {}
  # C0123ABC: dummy     # #dummy-project   <- fill in after creating the channel
