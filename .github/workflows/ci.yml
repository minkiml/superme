# Installs SuperMe the way a guest does, then runs the gates it ships with.
#
# Windows is the point: a good deal of this repo's path, encoding and process handling was
# written for an OS the author cannot run. A runner is the only thing that can answer whether
# it works.
name: CI

# Work lands on superme-dev and main is fast-forwarded onto the same commit, so testing both
# runs every job twice. A check belongs to a commit, and main inherits it.
on:
  push:
    branches: [superme-dev]
  pull_request:
  workflow_dispatch:

# A newer push makes an older run's answer worthless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os }} · python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Every cell reports. One platform failing must not hide the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # The floor the README promises, and a current release.
        python: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      # The three commands the README gives a new owner, in order.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install frontend dependencies
        run: npm ci --prefix web/frontend

      - name: Configure the install
        shell: bash
        run: |
          # A runner has no Claude credential, so setup reports NOT READY and exits 1. Every
          # other thing it does must still have happened.
          python setup_superme.py || true
          for f in .env superme_agent/config/repos.yaml superme_agent/.system.db superme_agent/.dev.db; do
            test -f "$f" || { echo "setup did not create $f"; exit 1; }
          done

      - name: Gate
        shell: bash
        run: |
          set +e
          bash scripts/check_fast.sh 2>&1 | tee gate.log
          code=${PIPESTATUS[0]}
          # Log downloads need admin rights; an annotation is readable by anyone.
          [ $code -ne 0 ] && bash .github/annotate.sh "Gate" gate.log
          exit $code

      - name: Offline suites
        shell: bash
        env:
          # Not a credential: `auth_status` takes a token at face value without calling anything,
          # and these suites assert what the surface offers an owner who can authenticate.
          CLAUDE_CODE_OAUTH_TOKEN: offline-suites-need-no-network
        run: |
          # `*_live` need a daemon and a credential; the reconcile suite needs a restart between
          # its two halves. Neither belongs on a runner.
          failed=""
          for f in scripts/test_*.py; do
            case "$f" in *_live.py|*_reconcile.py) continue ;; esac
            name=$(basename "$f" .py)
            echo "──────── $name"
            if ! python -m "scripts.$name" > "$name.log" 2>&1; then
              failed="$failed $name"
              bash .github/annotate.sh "$name" "$name.log"
            fi
            tail -5 "$name.log"
          done
          if [ -n "$failed" ]; then
            echo "FAILED:$failed"
            exit 1
          fi
