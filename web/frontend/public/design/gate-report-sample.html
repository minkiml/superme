<!doctype html>
<!--
  Plan gate report — TEMPLATE.
  The template owns ALL style, layout, and rendering. The agent fills exactly ONE slot:
  {"title": "Ledger CLI verbose flag", "item": "27eb782d8634", "ask": "Approving this plan creates the item's branch and lets build execute these tasks.", "surface": "CLI \u2014 python tally.py --verbose", "before": "$ python tally.py\ntotal: 42.50", "after": "$ python tally.py --verbose\n2026-07-01  12.50  groceries\n2026-07-02  30.00  rent\ntotal: 42.50", "touches": [{"component": "cli", "path": "tally.py", "action": "modify"}, {"component": "formatter", "path": "fmt.py", "action": "new"}, {"component": "ledger data", "path": "ledger/", "action": "read"}], "assumptions": ["--verbose lists entries date-ascending (no flag to change order)", "amounts keep two decimals, matching the existing total line"], "depth": "checks", "reason": "observable CLI surface \u2014 command checks suffice", "checks": [{"id": "verbose-lists-rows", "mode": "command", "expect": "output has one row per ledger entry plus the total line"}, {"id": "default-unchanged", "mode": "command", "expect": "plain `python tally.py` output is byte-identical to before"}], "tasks": 4} — a single-line JSON object (no markdown, no HTML) with this shape:

  {
    "title":  "<item title>",
    "item":   "<item id>",
    "ask":    "<one sentence — what approving this plan sets in motion>",
    "surface":"<short label of the previewed surface, e.g. 'CLI — tool list'>",
    "before": "<verbatim-shaped text of the surface today>",
    "after":  "<PREDICTED text of the same surface after the plan lands>",
    "touches":     [{"component": "...", "path": "...", "action": "new|modify|read"}, ...],
    "assumptions": ["one line each", ...],
    "depth":  "none|checks|scenarios",
    "reason": "<the vet-plan depth reason, one line>",
    "checks": [{"id": "...", "mode": "command|interaction|inspection", "expect": "..."}, ...],
    "tasks":  <int — number of plan tasks>
  }

  Every number shown is COUNTED from this data (real ratios, never invented scores).
  Output goes to work-items/<id>/artifacts/gate-report-plan.html (reader: user).
  A leftover {{...}} slot fails the pre-main gate check.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan gate report</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #21262d; --txt: #c9d1d9; --dim: #8b949e;
    --accent: #58a6ff; --new: #3fb950; --mod: #d29922; --read: #6e7681; --warn: #d29922;
  }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--txt); font: 14px/1.55 -apple-system, "Segoe UI", sans-serif;
         max-width: 880px; margin: 0 auto; padding: 36px 28px 64px; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 20px; margin-bottom: 8px; }
  .kicker { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
  h1 { font-size: 21px; font-weight: 650; margin: 6px 0 2px; }
  .itemid { font-size: 11px; color: var(--dim); }
  .hero { font-size: 17px; line-height: 1.5; margin: 22px 0 6px; font-weight: 430; }
  .hero b { color: var(--accent); font-weight: 700; }
  .ask { color: var(--dim); font-size: 13px; }
  section { margin-top: 40px; }
  .chnum { font-size: 30px; font-weight: 800; color: var(--accent); opacity: .85; }
  .chhead { display: flex; align-items: baseline; gap: 14px; }
  .chtitle { font-size: 16px; font-weight: 650; }
  .chkick { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
  .thesis { border-left: 3px solid var(--accent); background: rgba(88,166,255,.07);
            padding: 10px 14px; margin: 14px 0 18px; font-size: 13.5px; border-radius: 0 6px 6px 0; }
  .thesis b { color: var(--accent); }
  /* change map */
  .map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .col h3 { font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim);
            margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .node { border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px;
          padding: 7px 10px; margin-bottom: 8px; background: var(--panel); }
  .node .c { font-weight: 600; font-size: 13px; }
  .node .p { font-size: 11px; color: var(--dim); word-break: break-all; }
  .empty { color: var(--read); font-size: 12px; }
  .legend { margin-top: 10px; font-size: 11px; color: var(--dim); display: flex; gap: 16px; }
  .legend span { display: flex; align-items: center; gap: 5px; }
  /* before / after */
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .pane { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); overflow: hidden; }
  .pane .bar { display: flex; justify-content: space-between; align-items: center;
               padding: 6px 10px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--dim); }
  .badge { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 7px;
           border-radius: 10px; font-weight: 700; }
  .badge.now { background: rgba(110,118,129,.25); color: var(--dim); }
  .badge.pred { background: rgba(210,153,34,.18); color: var(--warn); }
  .pane pre { padding: 10px 12px; font-size: 12px; line-height: 1.5; overflow-x: auto;
              white-space: pre-wrap; word-break: break-word; }
  .surface { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  /* assumption cards */
  .cards { display: grid; gap: 10px; }
  .card { display: flex; gap: 12px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--panel); padding: 10px 14px; align-items: baseline; }
  .card .n { color: var(--accent); font-weight: 800; font-size: 13px; }
  .card .hint { margin-left: auto; font-size: 10px; color: var(--dim); letter-spacing: .06em;
                text-transform: uppercase; white-space: nowrap; }
  /* proof */
  .depthline { font-size: 13px; margin-bottom: 12px; }
  .depthline .mono { color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line); border-radius: 14px; background: var(--panel);
          padding: 4px 11px; font-size: 12px; display: flex; gap: 7px; align-items: baseline; }
  .chip .m { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .expect { font-size: 12px; color: var(--dim); margin-top: 10px; }
  footer { margin-top: 48px; border-top: 1px solid var(--line); padding-top: 12px;
           font-size: 10.5px; color: var(--read); }
</style>
</head>
<body>
<script type="application/json" id="data">{"title": "Ledger CLI verbose flag", "item": "27eb782d8634", "ask": "Approving this plan creates the item's branch and lets build execute these tasks.", "surface": "CLI \u2014 python tally.py --verbose", "before": "$ python tally.py\ntotal: 42.50", "after": "$ python tally.py --verbose\n2026-07-01  12.50  groceries\n2026-07-02  30.00  rent\ntotal: 42.50", "touches": [{"component": "cli", "path": "tally.py", "action": "modify"}, {"component": "formatter", "path": "fmt.py", "action": "new"}, {"component": "ledger data", "path": "ledger/", "action": "read"}], "assumptions": ["--verbose lists entries date-ascending (no flag to change order)", "amounts keep two decimals, matching the existing total line"], "depth": "checks", "reason": "observable CLI surface \u2014 command checks suffice", "checks": [{"id": "verbose-lists-rows", "mode": "command", "expect": "output has one row per ledger entry plus the total line"}, {"id": "default-unchanged", "mode": "command", "expect": "plain `python tally.py` output is byte-identical to before"}], "tasks": 4}</script>
<div id="root"></div>
<script>
(function () {
  var d = JSON.parse(document.getElementById("data").textContent);
  var t = d.touches || [], asm = d.assumptions || [], checks = d.checks || [];
  var by = function (a) { return t.filter(function (x) { return x.action === a; }); };
  var groups = { "new": by("new"), "modify": by("modify"), "read": by("read") };
  var esc = function (s) { return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); };
  var colors = { "new": "var(--new)", "modify": "var(--mod)", "read": "var(--read)" };
  var labels = { "new": "New", "modify": "Modified", "read": "Read-only" };

  function nodes(a) {
    var g = groups[a];
    if (!g.length) return '<div class="empty">&minus; none</div>';
    return g.map(function (x) {
      return '<div class="node" style="border-left-color:' + colors[a] + '">' +
        '<div class="c">' + esc(x.component) + '</div>' +
        '<div class="p mono">' + esc(x.path) + '</div></div>';
    }).join("");
  }
  function col(a) {
    return '<div class="col"><h3><span class="dot" style="background:' + colors[a] + '"></span>' +
      labels[a] + ' <span class="mono">' + groups[a].length + '</span></h3>' + nodes(a) + '</div>';
  }
  function chapter(n, title, kick, thesis, body) {
    return '<section><div class="chhead"><span class="chnum mono">' + n + '</span>' +
      '<div><div class="chtitle">' + title + '</div><div class="chkick">' + kick + '</div></div></div>' +
      '<div class="thesis">' + thesis + '</div>' + body + '</section>';
  }

  var hero = '<p class="hero"><b>' + (d.tasks || 0) + ' task' + (d.tasks === 1 ? "" : "s") + '</b> touching ' +
    '<b>' + t.length + ' component' + (t.length === 1 ? "" : "s") + '</b> (' + groups["new"].length + ' new · ' +
    groups["modify"].length + ' modified), proven by <b>' + checks.length + ' check' +
    (checks.length === 1 ? "" : "s") + '</b> — <b>' + asm.length + ' assumption' +
    (asm.length === 1 ? "" : "s") + '</b> need' + (asm.length === 1 ? "s" : "") + ' your eyes.</p>';

  var html =
    '<header><div class="kicker">Plan gate · report</div>' +
    '<h1>' + esc(d.title) + '</h1>' +
    '<div class="itemid mono">' + esc(d.item) + '</div>' +
    hero + '<p class="ask">' + esc(d.ask) + '</p></header>';

  html += chapter("01", "What changes", "the change map, from the plan’s touches",
    '<b>' + groups["new"].length + ' new</b> and <b>' + groups["modify"].length +
    ' modified</b> component' + ((groups["new"].length + groups["modify"].length) === 1 ? "" : "s") +
    ' — the blast radius you’re approving. Read-only rows are context, not risk.',
    '<div class="map">' + col("new") + col("modify") + col("read") + '</div>' +
    '<div class="legend"><span><span class="dot" style="background:var(--new)"></span>created</span>' +
    '<span><span class="dot" style="background:var(--mod)"></span>edited</span>' +
    '<span><span class="dot" style="background:var(--read)"></span>consulted only</span></div>');

  html += chapter("02", "What you’ll see", "predicted behavior — same surface, before vs after",
    'The right pane is the plan’s <b>prediction</b>, not a capture — at review you’ll ' +
    'see the real one next to it.',
    '<div class="surface mono">' + esc(d.surface) + '</div>' +
    '<div class="panes">' +
    '<div class="pane"><div class="bar"><span>before</span><span class="badge now">today</span></div>' +
    '<pre class="mono">' + esc(d.before) + '</pre></div>' +
    '<div class="pane"><div class="bar"><span>after</span><span class="badge pred">predicted</span></div>' +
    '<pre class="mono">' + esc(d.after) + '</pre></div></div>');

  var cards = asm.length
    ? '<div class="cards">' + asm.map(function (a, i) {
        return '<div class="card"><span class="n mono">' + (i + 1) + '</span><span>' + esc(a) +
          '</span><span class="hint">confirm / adjust</span></div>';
      }).join("") + '</div>'
    : '<div class="empty">&minus; no assumptions recorded — the plan claims nothing was decided without you.</div>';
  html += chapter("03", "Your calls", "assumptions the plan made without you",
    'These ' + asm.length + ' line' + (asm.length === 1 ? "" : "s") +
    ' are <b>the real subject of this review</b> — everything else is mechanics.', cards);

  var chips = checks.map(function (c) {
    return '<div class="chip"><span class="mono">' + esc(c.id) + '</span><span class="m">' +
      esc(c.mode) + '</span></div>';
  }).join("");
  var expects = checks.map(function (c) {
    return '<div class="expect"><span class="mono">' + esc(c.id) + '</span> → ' + esc(c.expect) + '</div>';
  }).join("");
  html += chapter("04", "How it’s proven", "the vet plan a fresh agent will execute",
    'Depth <b>' + esc(d.depth) + '</b> — ' + esc(d.reason),
    (checks.length ? '<div class="chips">' + chips + '</div>' + expects
                   : '<div class="empty">&minus; no vet checks (depth: none) — approve only if there is truly no observable surface.</div>'));

  html += '<footer class="mono">generated by superme-dev:plan · item ' + esc(d.item) +
    ' · data: plan.md (touches / behavior preview / risks &amp; assumptions / vet plan)</footer>';
  document.getElementById("root").innerHTML = html;
})();
</script>
</body>
</html>
